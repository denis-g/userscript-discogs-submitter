<div class="discogs-submitter__select" data-attr="class:containerClass">
  <div class="discogs-submitter__select__label">
    <div class="discogs-submitter__select__placeholder"><var>placeholder</var></div>
    <var data-if="isMultiple">
      <div class="discogs-submitter__select__count"><var>count</var></div>
    </var>

    <svg class="discogs-submitter__select__arrow" aria-hidden="true"><use href="#ds-icon-chevron-down"></use></svg>
  </div>

  <div class="discogs-submitter__select__list" role="listbox"></div>
</div>
